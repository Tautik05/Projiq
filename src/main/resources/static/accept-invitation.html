<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Workspace Invitation – Projiq</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="h-full flex flex-col justify-center items-center p-4 antialiased text-slate-900">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-600 text-white font-extrabold text-xl shadow-md shadow-brand-500/25 mb-3">
                P
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Workspace Invitation</h2>
            <p class="text-xs text-slate-500 mt-1">You have been invited to collaborate on Projiq.</p>
        </div>

        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

        <!-- Authenticated State: Click to Accept -->
        <div id="state-auth-accept" class="hidden space-y-4 text-center">
            <p class="text-sm text-slate-600">
                You are currently signed in as <span id="current-user-email" class="font-bold text-slate-800"></span>.
            </p>
            <button id="btn-accept-invitation"
                    class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 transition shadow-lg shadow-brand-500/25">
                Accept Invitation & Join Workspace
            </button>
            <button id="btn-switch-account" class="text-xs text-slate-400 hover:text-slate-600 hover:underline">
                Sign in with a different account
            </button>
        </div>

        <!-- Unauthenticated State: Sign In or Register -->
        <div id="state-login-required" class="hidden space-y-4">
            <div class="p-3 bg-brand-50 rounded-xl text-xs text-brand-700 font-medium">
                Please sign in or create an account to accept your invitation.
            </div>

            <!-- Tab switcher -->
            <div class="flex border-b border-slate-200 mb-4">
                <button id="tab-login" class="flex-1 pb-2.5 text-xs font-semibold text-brand-600 border-b-2 border-brand-600">Sign In</button>
                <button id="tab-register" class="flex-1 pb-2.5 text-xs font-semibold text-slate-400 border-b-2 border-transparent">Create Account</button>
            </div>

            <form id="invite-login-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="login-email" required placeholder="name@company.com"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="login-pwd" required placeholder="••••••••"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-xl shadow-md transition">
                    Sign In & Accept
                </button>
            </form>

            <form id="invite-reg-form" class="hidden space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Full Name</label>
                    <input type="text" id="reg-name" required placeholder="Alice Johnson"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email</label>
                    <input type="email" id="reg-email" required placeholder="alice@acme.com"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="reg-pwd" required minlength="8" placeholder="At least 8 characters"
                           class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:ring-2 focus:ring-brand-500 focus:outline-none">
                </div>
                <button type="submit" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-xs rounded-xl shadow-md transition">
                    Create Account & Accept
                </button>
            </form>
        </div>

        <!-- Success State -->
        <div id="state-success" class="hidden text-center space-y-4">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 mx-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900">Invitation Accepted!</h3>
            <p class="text-xs text-slate-500">You are now a member of the workspace. Redirecting you to your projects...</p>
            <div class="pt-2">
                <a href="/index.html" class="inline-block w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl transition">
                    Go to Workspace
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const alertBox = document.getElementById('alert-box');

            function showAlert(msg, isError = true) {
                alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${isError ? 'bg-rose-50 text-rose-600 border border-rose-100' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}`;
                alertBox.textContent = msg;
                alertBox.classList.remove('hidden');
            }

            if (!token) {
                showAlert('No invitation token found in link.');
                return;
            }

            let storedTokens = null;
            try {
                storedTokens = JSON.parse(localStorage.getItem('projiq_tokens'));
            } catch (e) {}

            async function checkAuthAndRender() {
                if (storedTokens && storedTokens.accessToken) {
                    try {
                        const res = await fetch('/api/auth/me', {
                            headers: { 'Authorization': `Bearer ${storedTokens.accessToken}` }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            document.getElementById('current-user-email').textContent = data.data.email;
                            document.getElementById('state-auth-accept').classList.remove('hidden');
                            document.getElementById('state-login-required').classList.add('hidden');
                            return;
                        }
                    } catch (e) {}
                }

                // If not authenticated
                document.getElementById('state-auth-accept').classList.add('hidden');
                document.getElementById('state-login-required').classList.remove('hidden');
            }

            await checkAuthAndRender();

            // Accept button handler
            document.getElementById('btn-accept-invitation')?.addEventListener('click', async () => {
                const btn = document.getElementById('btn-accept-invitation');
                btn.disabled = true;
                btn.textContent = 'Accepting...';
                alertBox.classList.add('hidden');

                try {
                    const res = await fetch('/api/invitations/accept', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${storedTokens.accessToken}`
                        },
                        body: JSON.stringify({ token })
                    });

                    const data = await res.json().catch(() => null);

                    if (res.ok) {
                        document.getElementById('state-auth-accept').classList.add('hidden');
                        document.getElementById('state-success').classList.remove('hidden');
                        setTimeout(() => window.location.href = '/index.html', 2000);
                    } else {
                        btn.disabled = false;
                        btn.textContent = 'Accept Invitation & Join Workspace';
                        showAlert((data && (data.message || data.error)) || 'Failed to accept invitation.');
                    }
                } catch (err) {
                    btn.disabled = false;
                    btn.textContent = 'Accept Invitation & Join Workspace';
                    showAlert('A network error occurred.');
                }
            });

            // Switch account
            document.getElementById('btn-switch-account')?.addEventListener('click', () => {
                localStorage.removeItem('projiq_tokens');
                storedTokens = null;
                checkAuthAndRender();
            });

            // Tab switcher
            const tabLogin = document.getElementById('tab-login');
            const tabReg = document.getElementById('tab-register');
            const loginForm = document.getElementById('invite-login-form');
            const regForm = document.getElementById('invite-reg-form');

            tabLogin.addEventListener('click', () => {
                tabLogin.className = 'flex-1 pb-2.5 text-xs font-semibold text-brand-600 border-b-2 border-brand-600';
                tabReg.className = 'flex-1 pb-2.5 text-xs font-semibold text-slate-400 border-b-2 border-transparent';
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
            });

            tabReg.addEventListener('click', () => {
                tabReg.className = 'flex-1 pb-2.5 text-xs font-semibold text-brand-600 border-b-2 border-brand-600';
                tabLogin.className = 'flex-1 pb-2.5 text-xs font-semibold text-slate-400 border-b-2 border-transparent';
                regForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            });

            // Login & Accept
            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.classList.add('hidden');
                const email = document.getElementById('login-email').value.trim();
                const password = document.getElementById('login-pwd').value;

                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error((data && (data.message || data.error)) || 'Login failed');

                    storedTokens = data.data;
                    localStorage.setItem('projiq_tokens', JSON.stringify({
                        accessToken: storedTokens.accessToken,
                        refreshToken: storedTokens.refreshToken
                    }));

                    // Directly accept
                    document.getElementById('state-login-required').classList.add('hidden');
                    document.getElementById('state-auth-accept').classList.remove('hidden');
                    document.getElementById('btn-accept-invitation').click();
                } catch (err) {
                    showAlert(err.message);
                }
            });

            // Register & Accept
            regForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                alertBox.classList.add('hidden');
                const fullName = document.getElementById('reg-name').value.trim();
                const email = document.getElementById('reg-email').value.trim();
                const password = document.getElementById('reg-pwd').value;

                try {
                    const res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ fullName, email, password })
                    });
                    const data = await res.json();
                    if (!res.ok) throw new Error((data && (data.message || data.error)) || 'Registration failed');

                    storedTokens = data.data;
                    localStorage.setItem('projiq_tokens', JSON.stringify({
                        accessToken: storedTokens.accessToken,
                        refreshToken: storedTokens.refreshToken
                    }));

                    // Directly accept
                    document.getElementById('state-login-required').classList.add('hidden');
                    document.getElementById('state-auth-accept').classList.remove('hidden');
                    document.getElementById('btn-accept-invitation').click();
                } catch (err) {
                    showAlert(err.message);
                }
            });
        });
    </script>
</body>
</html>
