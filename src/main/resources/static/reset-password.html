<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Projiq</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="h-full flex flex-col justify-center items-center p-4 antialiased text-slate-900">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl shadow-xl shadow-slate-200/50 border border-slate-100">
        <!-- Logo -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-brand-600 text-white font-extrabold text-xl shadow-md shadow-brand-500/25 mb-3">
                P
            </div>
            <h2 class="text-2xl font-bold text-slate-900">Set New Password</h2>
            <p class="text-xs text-slate-500 mt-1">Please enter your new password below.</p>
        </div>

        <div id="alert-box" class="hidden mb-4 p-3 rounded-xl text-xs font-semibold"></div>

        <!-- Reset Form -->
        <form id="reset-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">New Password</label>
                <input type="password" id="new-password" required minlength="8" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Confirm Password</label>
                <input type="password" id="confirm-password" required minlength="8" placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm">
            </div>
            <button type="submit" id="btn-submit"
                    class="w-full py-3 px-4 rounded-xl text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 transition shadow-lg shadow-brand-500/25">
                Reset Password
            </button>
        </form>

        <!-- Success Message -->
        <div id="reset-success" class="hidden text-center space-y-4">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 mx-auto">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
            </div>
            <h3 class="text-lg font-bold text-slate-900">Password Reset Successful</h3>
            <p class="text-xs text-slate-500">Your password has been securely updated. You can now log into your Projiq workspace.</p>
            <div class="pt-2">
                <a href="/index.html" class="inline-block w-full py-2.5 px-4 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-xl transition">
                    Sign In
                </a>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const alertBox = document.getElementById('alert-box');
            const form = document.getElementById('reset-form');
            const successView = document.getElementById('reset-success');

            function showAlert(msg, isError = true) {
                alertBox.className = `mb-4 p-3 rounded-xl text-xs font-semibold ${isError ? 'bg-rose-50 text-rose-600 border border-rose-100' : 'bg-emerald-50 text-emerald-600 border border-emerald-100'}`;
                alertBox.textContent = msg;
                alertBox.classList.remove('hidden');
            }

            if (!token) {
                showAlert('No password reset token was provided in the link. Please request a new reset link.');
                form.classList.add('hidden');
                return;
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new-password').value;
                const confirmPassword = document.getElementById('confirm-password').value;

                if (newPassword !== confirmPassword) {
                    showAlert('Passwords do not match. Please verify both fields.');
                    return;
                }

                alertBox.classList.add('hidden');
                const btn = document.getElementById('btn-submit');
                btn.disabled = true;
                btn.textContent = 'Updating password...';

                try {
                    const response = await fetch('/api/auth/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, newPassword })
                    });

                    const data = await response.json().catch(() => null);

                    if (response.ok) {
                        form.classList.add('hidden');
                        successView.classList.remove('hidden');
                    } else {
                        btn.disabled = false;
                        btn.textContent = 'Reset Password';
                        showAlert((data && (data.message || data.error)) || 'Failed to reset password. The link may have expired.');
                    }
                } catch (err) {
                    btn.disabled = false;
                    btn.textContent = 'Reset Password';
                    showAlert('A network error occurred. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
